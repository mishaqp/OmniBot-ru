name: Finalize Russian release

on:
  push:
    branches:
      - feature/russian-localization

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/russian-localization
          fetch-depth: 0

      - name: Patch signing and remaining Russian strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          mappings = {
              'OMNI_RELEASE_STORE_FILE': 'ANDROID_KEYSTORE_PATH',
              'OMNI_RELEASE_STORE_PWD': 'ANDROID_KEYSTORE_PASSWORD',
              'OMNI_RELEASE_KEY_ALIAS': 'ANDROID_KEY_ALIAS',
              'OMNI_RELEASE_KEY_PWD': 'ANDROID_KEY_PASSWORD',
          }
          for path in ['app/build.gradle.kts', 'scripts/build-local-release.sh', '.github/workflows/release.yml']:
              text = Path(path).read_text(encoding='utf-8')
              for old, new in mappings.items():
                  text = text.replace(old, new)
              write(path, text)

          release_path = Path('.github/workflows/release.yml')
          text = release_path.read_text(encoding='utf-8')
          text = text.replace(
              'RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}',
              'ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE }}',
          )
          text = text.replace('${RELEASE_KEYSTORE_B64}', '${ANDROID_KEYSTORE_BASE64}')
          text = text.replace('Missing RELEASE_KEYSTORE secret.', 'Missing ANDROID_KEYSTORE_BASE64 secret.')
          text = text.replace(
              'ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}',
              'ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.RELEASE_PASSWORD }}',
          )
          text = text.replace(
              'ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}',
              'ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}',
          )
          text = text.replace(
              'ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}',
              'ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.RELEASE_PASSWORD }}',
          )
          write(release_path, text)

          for path in Path('app').rglob('AgentSystemPrompt.kt'):
              text = path.read_text(encoding='utf-8').replace('или整理 памяти', 'или упорядочивания памяти')
              write(path, text)

          for path_str in ['ui/lib/l10n/app_en.arb', 'ui/lib/l10n/app_zh.arb', 'ui/lib/l10n/app_ru.arb']:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if '"languageRussian"' not in text:
                  m = re.search(r'(?m)^(\s*)"languageEnglish"\s*:\s*"(?:\\.|[^"\\])*"\s*,?\s*$', text)
                  if not m:
                      raise SystemExit(f'languageEnglish key not found in {path}')
                  original = m.group(0).rstrip()
                  if not original.endswith(','):
                      original += ','
                  indent = m.group(1)
                  replacement = original + '\n' + indent + '"languageRussian": "Русский",'
                  text = text[:m.start()] + replacement + text[m.end():]
              json.loads(text)
              write(path, text)

          selector = Path('ui/lib/features/home/pages/settings/background_setting_page.dart')
          text = selector.read_text(encoding='utf-8')
          text = text.replace("label: 'Русский',", 'label: context.l10n.languageRussian,')
          write(selector, text)
          PY

      - name: Validate localization and inventory OOB consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool ui/lib/l10n/app_en.arb >/dev/null
          python3 -m json.tool ui/lib/l10n/app_zh.arb >/dev/null
          python3 -m json.tool ui/lib/l10n/app_ru.arb >/dev/null
          echo '=== OOB schema/source candidates ==='
          find . -type f \( -iname '*oob*' -o -iname '*action*schema*' \) -not -path './.git/*' | sort | head -200
          echo '=== OOB schema consumers ==='
          grep -RIn --include='*.kt' --include='*.java' -E 'OobActionSchema|\.enUs|\.zhCn|uiLabel|promptGuide' app baselib assists uikit 2>/dev/null | head -500 || true
          echo '=== Signing variables ==='
          grep -RIn -E 'ANDROID_KEYSTORE_(BASE64|PATH|PASSWORD)|ANDROID_KEY_(ALIAS|PASSWORD)' .github/workflows/release.yml scripts/build-local-release.sh app/build.gradle.kts

      - name: Commit non-workflow finalization changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/workflows/release.yml
          git add scripts/build-local-release.sh app/build.gradle.kts app ui
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat(release): finalize Russian localization and signing variables'
          git push origin HEAD:feature/russian-localization
