name: Apply Russian localization patch

on:
  push:
    branches:
      - feature/russian-localization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/russian-localization
          fetch-depth: 0

      - name: Add Russian language option to Appearance
        shell: python
        run: |
          from pathlib import Path

          path = Path('ui/lib/features/home/pages/settings/background_setting_page.dart')
          text = path.read_text(encoding='utf-8')
          old = """              OmniSegmentedOption<AppLanguageMode>(
                value: AppLanguageMode.en,
                label: context.l10n.languageEnglish,
                icon: LucideIcons.languages,
                id: 'en',
              ),
"""
          new = old + """              OmniSegmentedOption<AppLanguageMode>(
                value: AppLanguageMode.ru,
                label: 'Русский',
                icon: LucideIcons.languages,
                id: 'ru',
              ),
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one language selector block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate Russian ARB JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          json.loads(Path('ui/lib/l10n/app_ru.arb').read_text(encoding='utf-8'))

      - name: Remove temporary workflow and commit patch
        run: |
          git rm .github/workflows/apply-russian-localization-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/lib/features/home/pages/settings/background_setting_page.dart
          git commit -m "feat(i18n): expose Russian language in Appearance"
          git push origin HEAD:feature/russian-localization
