name: Apply Russian localization fixes

on:
  push:
    branches:
      - feature/russian-localization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/russian-localization
          fetch-depth: 0

      - name: Apply localization patch
        run: python3 scripts/fix_ru_localization.py

      - name: Commit fixes
        run: |
          git rm scripts/fix_ru_localization.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cn/com/omnimind/bot/agent/runtime/OmniAgentExecutor.kt
          git add app/src/main/java/cn/com/omnimind/bot/agent/tool/AgentToolDefinitions.kt
          git add app/src/main/java/cn/com/omnimind/bot/agent/workspace/memory/WorkspaceMemoryService.kt
          git add app/src/main/java/cn/com/omnimind/bot/manager/AssistsCoreManager.kt
          git commit -m "fix(i18n): complete Russian agent and memory localization"
          git push origin HEAD:feature/russian-localization
